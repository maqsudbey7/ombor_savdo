# PostgreSQL'ni Docker orqali ishga tushirish: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ombor
      POSTGRES_PASSWORD: ombor
      POSTGRES_DB: ombor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
